<!doctype html>
<html lang="ko"><head><meta charset="utf-8">

<style>

.tb .btn{padding:6px 10px}.tb [data-fx=b]{font-weight:900}.tb [data-fx=i]{font-style:italic}.tb [data-fx=u]{text-decoration:underline}.tb [data-fx=s]{text-decoration:line-through}.tb [data-fx=h]{background:#fff176;color:#222}

</style></head><body>
<div class="tabs"><button class="t on" id="b1">편집</button><button class="t" id="b2">미리보기</button><span class="sp"></span><button class="btn" id="cp" title="나무위키 문법으로 복사">나무마크</button><button class="btn" id="xc" title="완성된 문서의 HTML 코드를 복사">HTML 복사</button><button class="btn" id="xh" title="완성된 문서를 HTML 파일로 저장">HTML 저장</button><button class="btn" id="rs">초기화</button></div>
<main><div id="ed"></div><div id="pv"><div class="doc" id="doc"></div></div></main>
<script>
const UN={"Leo/need":"#4455dd","MORE MORE JUMP!":"#88dd44","Vivid BAD SQUAD":"#ee1166","원더랜즈×쇼타임":"#ff9900","25시, 나이트 코드에서.":"#884499","VIRTUAL SINGER":"#33ccbb"};
const INFO=[["gender","성별"],["bd","생일"],["ht","신장"],["sc","학교"],["gr","학년 / 반"],["hb","취미"],["sk","특기"],["dl","싫어하는 것"],["fd","좋아하는 음식"],["fdl","싫어하는 음식"],["cv","성우"]];
const TREE=[{t:"개요",k:"ov"},{t:"특징",c:[{t:"비주얼",k:"vis"},{t:"성격",k:"per"},{t:"재능",k:"tal"},{t:"기타",k:"e1"}]},{t:"음악 스타일",c:[{t:"보컬",k:"voc"},{t:"댄스",k:"dan"}]},{t:"작중 행적",c:[{t:"메인 스토리",k:"main"},{t:"이벤트 스토리",k:"evt"},{t:"행적 일람표",k:"acts"}]},{t:"인물 관계",k:"rel"},{t:"호칭",k:"nick"},{t:"게임 대사집",k:"lines"},{t:"역대 프로필",k:"prof"},{t:"Live2D",k:"l2d"},{t:"어록",k:"q"},{t:"기타",k:"e2"}];
const LEAF=[];(function w(a){a.forEach(n=>n.c?w(n.c):LEAF.push(n))})(TREE);
const LD={rel:[["n","인물 이름"],["a","랭크 5 문구"],["b","랭크 26 문구"],["c","랭크 46 문구"]],nick:[["n","인물"],["x","부르는 호칭"],["y","불리는 호칭"]],acts:[["t","구분 (메인/이벤트/월드링크)"],["n","스토리 제목"],["s","수록곡"],["k","카드 (★3 카드명)"]],lines:[["t","조건 (봄/터치 등)"],["y","연도"],["n","대사"]],prof:[["n","라벨 (1학년 등)"],["i","이미지","img"]],l2d:[["n","라벨 (교복 등)"],["i","이미지","img"]]};
const blank=k=>Object.fromEntries(LD[k].map(f=>[f[0],""]));
const DEF={kr:"",jp:"",ro:"",unit:"Vivid BAD SQUAD",color:"#ff6699",img:"",slogan:"",v1:"",v2:"",first:"",imgfit:"contain",imgh:"420",q:""};Object.keys(LD).forEach(k=>DEF[k]=[blank(k)]);
let S=load();
function load(){try{const r=localStorage.getItem("pjsk-doc");if(r)return Object.assign(JSON.parse(JSON.stringify(DEF)),JSON.parse(r))}catch(e){}return JSON.parse(JSON.stringify(DEF))}
function save(){try{localStorage.setItem("pjsk-doc",JSON.stringify(S))}catch(e){}}
const esc=s=>String(s||"").replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
let FN=[];const lum=c=>{let h=c.slice(1);if(h.length<6)h=h.replace(/./g,"$&$&");const [r,g,b]=[0,2,4].map(i=>parseInt(h.substr(i,2),16));return .299*r+.587*g+.114*b>150?"#222":"#fff"};const rich=s=>s.replace(/\{\{yt:(.+?)\}\}/g,(m,u)=>yt(u.replace(/&amp;/g,"&"))).replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a class="lk" href="$2" target="_blank" rel="noopener">$1</a>').replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<i>$1</i>").replace(/__(.+?)__/g,"<u>$1</u>").replace(/~~(.+?)~~/g,"<s>$1</s>").replace(/==(?:\{(#(?:[0-9a-fA-F]{6}|[0-9a-fA-F]{3}))\})?(.+?)==/g,(m,c,t)=>c?`<mark style="background:${c};color:${lum(c)}">${t}</mark>`:`<mark>${t}</mark>`);
const fmt=s=>esc(s).replace(/\[\*((?:[^\[\]]|\[[^\]]*\]\([^)]*\))+)\]/g,(m,t)=>{FN.push(t);const n=FN.length;return`<sup><a id="r${n}" href="#fn${n}">[${n}]</a></sup>`}).replace(/^[\s\S]*$/,m=>rich(m)).replace(/\[\[(.+?)\]\]/g,'<span class="lk">$1</span>').replace(/\n/g,"<br>");
const vis=n=>S.all!==false||has(n);const has=n=>n.c?n.c.some(has):LD[n.k]?S[n.k].some(r=>Object.values(r).some(v=>v)):n.k==="ov"?(S.ov||S.slogan||S.v1||S.v2||"").trim():(S[n.k]||"").trim();
function form(){
 let h='<div class="tb">'+[["b","B"],["i","I"],["u","U"],["s","S"],["h","형광펜"],["a","링크"],["f","각주"],["v","영상"]].map(([k,l])=>`<button type="button" class="btn" data-fx="${k}">${l}</button>`).join("")+`<input type="color" id="hc" value="${HC}" title="형광펜 색">`+'</div><fieldset><legend>기본 정보</legend>';
 h+=`<label>한국어 이름</label><input data-k="kr" value="${esc(S.kr)}" placeholder="이름">`;
 h+=`<label>일본어 이름</label><input data-k="jp" value="${esc(S.jp)}"><label>로마자</label><input data-k="ro" value="${esc(S.ro)}">`;
 h+=`<label>소속 유닛 (직접 입력)</label><input data-k="unit" list="ul" value="${esc(S.unit)}"><datalist id="ul">${Object.keys(UN).map(u=>`<option value="${esc(u)}">`).join("")}</datalist><label>1인칭 (호칭표)</label><input data-k="first" value="${esc(S.first)}" placeholder="나(私)">`;
 h+=`<label>이미지 컬러</label><input type="color" data-k="color" value="${S.color}">`;
 h+=`<label>입상 일러스트 (직접 업로드)</label><input type="file" id="fi" accept="image/*"><label>이미지 맞춤</label><select data-k="imgfit"><option value="contain"${S.imgfit!=="cover"?" selected":""}>전체가 보이게 맞춤</option><option value="cover"${S.imgfit==="cover"?" selected":""}>프레임에 꽉 채우기</option></select><label>이미지 높이</label><input type="range" data-k="imgh" min="200" max="720" step="10" value="${S.imgh||420}">`;
 INFO.forEach(([k,l])=>h+=`<label>${l}</label><input data-k="i_${k}" value="${esc(S["i_"+k])}">${k==="ht"||k==="gr"?`<label>${l} - 진급 이전 (접이식)</label><input data-k="i_${k}o" value="${esc(S["i_"+k+"o"])}" placeholder="예: 1학년 A반">`:""}`);
 h+='</fieldset><fieldset><legend>문서 본문</legend><div class="mu" style="font-size:12px;color:var(--mu)">입력 칸을 누른 뒤 위 버튼으로 서식을 넣어요. 문법: **굵게** *기울임* __밑줄__ ~~취소선~~ ==형광펜== =={#ffb3d9}색 지정== [글자](주소) [*각주] {{yt:유튜브주소}} [[링크색]]</div>';
 h+=`<label><input type="checkbox" data-k="all" ${S.all!==false?"checked":""} style="width:auto"> 내용이 없는 항목도 목차에 표시</label><label>개요 인용구 (대표 대사)</label><input data-k="slogan" value="${esc(S.slogan)}"><label>자기소개 영상 (유튜브 주소)</label><input data-k="v1" value="${esc(S.v1)}"><label>이전 자기소개 영상 (접이식)</label><input data-k="v2" value="${esc(S.v2)}">`;
 LEAF.filter(n=>!LD[n.k]&&n.k!=="q").forEach(n=>h+=`<label>${n.t}</label><textarea data-k="${n.k}">${esc(S[n.k])}</textarea>`);
 h+=`<label>어록 (한 줄에 “대사 || 출처”)</label><textarea data-k="q">${esc(S.q)}</textarea></fieldset>`;
 h+='<fieldset><legend>인물 관계 (칭호 문구 3개)</legend>';
 S.rel.forEach((r,i)=>h+=`<div class="row"><input data-l="rel" data-i="${i}" data-f="n" placeholder="인물 이름" value="${esc(r.n)}"><input data-l="rel" data-i="${i}" data-f="a" placeholder="랭크 5 문구" value="${esc(r.a)}"><input data-l="rel" data-i="${i}" data-f="b" placeholder="랭크 26 문구" value="${esc(r.b)}"><input data-l="rel" data-i="${i}" data-f="c" placeholder="랭크 46 문구" value="${esc(r.c)}"><button class="btn rm" data-rm="rel" data-i="${i}">삭제</button></div>`);
 h+='<button class="btn" data-add="rel">+ 인물 추가</button></fieldset><fieldset><legend>호칭</legend>';
 S.nick.forEach((r,i)=>h+=`<div class="row"><input data-l="nick" data-i="${i}" data-f="n" placeholder="인물" value="${esc(r.n)}"><input data-l="nick" data-i="${i}" data-f="x" placeholder="부르는 호칭" value="${esc(r.x)}"><input data-l="nick" data-i="${i}" data-f="y" placeholder="불리는 호칭" value="${esc(r.y)}"><button class="btn rm" data-rm="nick" data-i="${i}">삭제</button></div>`);
 h+='<button class="btn" data-add="nick">+ 행 추가</button></fieldset>';
 const TT={acts:"작중 행적 일람표",lines:"게임 대사집",prof:"역대 프로필",l2d:"Live2D"};
 ["acts","lines","prof","l2d"].forEach(k=>{h+=`<fieldset><legend>${TT[k]}</legend>`;S[k].forEach((r,i)=>{h+='<div class="row">'+LD[k].map(([f,l,t])=>t?`<label>${l}${r[f]?" ✓":""}</label><input type="file" accept="image/*" data-img="${k}" data-i="${i}" data-f="${f}">`:`<input data-l="${k}" data-i="${i}" data-f="${f}" placeholder="${l}" value="${esc(r[f])}">`).join("")+`<button class="btn rm" data-rm="${k}" data-i="${i}">삭제</button></div>`});h+=`<button class="btn" data-add="${k}">+ 행 추가</button></fieldset>`});
 ed.innerHTML=h;
 document.getElementById("fi").onchange=e=>{const f=e.target.files[0];if(!f)return;shrink(f,1000,d=>{S.img=d;save();draw()})};
}
const shrink=(file,max,cb)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);cb(c.toDataURL("image/webp",.9))};i.onerror=()=>cb(r.result);i.src=r.result};r.readAsDataURL(file)};
const yt=u=>{const m=(u||"").match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);return m?`<iframe class="vid" src="https://www.youtube-nocookie.com/embed/${m[1]}" allowfullscreen loading="lazy"></iframe>`:/^https?:/.test(u||"")?`<a class="lk" href="${esc(u)}">${esc(u)}</a>`:""};
const vid=()=>(S.v1?`<div>${yt(S.v1)}</div>`:"")+(S.v2?`<details><summary>이전 자기소개 펼치기 · 접기</summary><div>${yt(S.v2)}</div></details>`:"");
const fnl=()=>FN.length?`<div class="fnl">${FN.map((t,i)=>`<div id="fn${i+1}"><a class="lk" href="#r${i+1}">[${i+1}]</a> ${rich(t)}</div>`).join("")}</div>`:"";
const tb=(h,rows)=>`<div class="sc"><table class="t2"><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${rows}</table></div>`;
function spec(k){const R=S[k].filter(r=>Object.values(r).some(v=>v));
 if(k==="acts")return tb(["구분","스토리","수록곡","카드"],R.map(r=>`<tr><td>${esc(r.t)}</td><td>${fmt(r.n)}</td><td>${esc(r.s)}</td><td>${esc(r.k)}</td></tr>`).join(""));
 if(k==="lines")return`<details open><summary>펼치기 · 접기</summary><div>`+tb(["조건","연도","대사"],R.map(r=>`<tr><td>${esc(r.t)}</td><td>${esc(r.y)}</td><td>${fmt(r.n)}</td></tr>`).join(""))+`</div></details>`;
 return`<div class="gal">${R.map(r=>`<figure>${r.i?`<img src="${r.i}" alt="">`:""}<figcaption>${esc(r.n)}</figcaption></figure>`).join("")}</div>`}
const mk=k=>LD[k]?S[k].filter(r=>Object.values(r).some(v=>v)).map(r=>"|| "+LD[k].filter(f=>!f[2]).map(f=>r[f[0]]).join(" || ")+" ||").join("\n"):S[k];
function draw(){
 const col=S.color||"#ff6699";document.documentElement.style.setProperty("--c",col);

function mark(){
 let o="",a=0;
 TREE.forEach(n=>{if(!has(n))return;a++;o+=`== ${n.t} ==\n`;
  if(n.c)n.c.forEach(c=>{if(has(c))o+=`=== ${c.t} ===\n${mk(c.k)}\n\n`});
  else if(n.k==="rel")S.rel.filter(r=>r.n).forEach(r=>{o+=` * ${r.n}\n   * ${[r.a,r.b,r.c].filter(Boolean).join(" / ")}\n`});
  else if(n.k==="nick"){o+="||<tablealign=center> 인물 || 부르는 호칭 || 불리는 호칭 ||\n";S.nick.filter(r=>r.n).forEach(r=>o+=`|| ${r.n} || ${r.x} || ${r.y} ||\n`)}
  else if(n.k==="q")S.q.split("\n").filter(x=>x.trim()).forEach(l=>{const[x,y]=l.split("||");o+=`> ${x.trim()}${y?" - "+y.trim():""}\n`});
  else o+=`${mk(n.k)}\n`;o+="\n"});
 return o.replace(/\[\*(.+?)\]/g,"[* $1]").replace(/\{\{yt:(?:.*?(?:v=|youtu\.be\/|embed\/|shorts\/))([\w-]{11}).*?\}\}/g,"[youtube($1)]").replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,"[[$2|$1]]").replace(/\*\*(.+?)\*\*/g,"'''$1'''").replace(/\*(.+?)\*/g,"''$1''").replace(/==(?:\{#[0-9a-fA-F]+\})?(.+?)==/g,"$1").replace(/\[\[(.+?)\]\]/g,"[[$1]]");
}
